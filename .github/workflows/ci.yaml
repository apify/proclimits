name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

# One run per branch. A push that supersedes another cancels it, except on master, where every commit is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  actions_lint_check:
    name: Actions lint check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12

  # One interpreter for both: ruff takes the target version from its config and ty takes `python-version` from
  # `[tool.ty.environment]`, so what the runner runs on decides nothing. The unit tests below are where the
  # interpreter is a real axis.
  lint_check:
    name: Lint check
    runs-on: ubuntu-latest
    steps:
      - uses: apify/actions/python-lint-check@v1.9.0
        with:
          python-version: "3.13"

  type_check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: apify/actions/python-type-check@v1.9.0
        with:
          python-version: "3.13"

  unit_tests:
    name: Unit tests (${{ matrix.os }}, ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: apify/actions/python-unit-tests@v1.9.0
        with:
          python-version: ${{ matrix.python-version }}
          run-tests-command: uv run poe unit-tests

  checks:
    name: CI checks
    needs: [actions_lint_check, lint_check, type_check, unit_tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Nothing above is conditional, so a skipped dependency would mean the run never got that far.
      - name: Fail unless every check succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
